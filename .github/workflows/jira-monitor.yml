name: Jira Board Monitor

on:
  # Run every 5 minutes
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes, 24/7

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force a check regardless of schedule'
        required: false
        default: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit known_issues.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create data directory
        run: mkdir -p data

      - name: Run Jira Monitor
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python jira_check.py

      - name: Commit known issues
        # Only commit if there are changes (new issues detected)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/known_issues.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update known issues [skip ci]"
          git push

      - name: Monitor Summary
        if: always()
        run: |
          echo "### Jira Monitor Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "⏰ Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f data/known_issues.json ]; then
            KNOWN_COUNT=$(python -c "import json; print(len(json.load(open('data/known_issues.json')).get('issues', [])))")
            echo "📊 Known Issues: $KNOWN_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
